name: 버그 리포트
description: 버그나 오류를 발견하셨나요? 상세히 알려주세요.
title: "[Bug] "
labels: ["type: bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 버그 리포트 작성 가이드
        버그를 재현하고 수정하는데 필요한 정보를 자세히 작성해주세요.

  - type: dropdown
    id: platform
    attributes:
      label: 발생 플랫폼
      description: 버그가 발생한 플랫폼을 선택해주세요.
      options:
        - 차량 앱
        - Server
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 간단히 설명해주세요.
      placeholder: "예: 운행 종료 버튼을 누르면 앱이 강제 종료됩니다."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 순서대로 작성해주세요.
      placeholder: |
        1. 운전자를 선택하고 운행을 시작합니다
        2. Virtual Console에서 Odometer 값을 올립니다
        3. 운행 종료를 누르면 앱이 멈춥니다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 어떻게 동작해야 한다고 생각하시나요?
      placeholder: "예: 운행이 종료되고 목적 선택 화면이 표시되어야 합니다."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떻게 동작했나요?
      placeholder: "예: 앱이 강제 종료되었습니다."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 가능하다면 스크린샷이나 화면 녹화, Virtual Console 설정을 첨부해주세요.
      placeholder: 이미지를 드래그하여 첨부할 수 있습니다.

  - type: input
    id: environment
    attributes:
      label: 환경 정보
      description: 에뮬레이터/차량 모델, Pleos 버전, 앱 버전 등
      placeholder: "예: Pleos Connect 에뮬레이터 v2.1.0 (API 34), AutoLog 0.1.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 에러 메시지
      description: 관련된 로그나 에러 메시지가 있다면 첨부해주세요.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 이 버그와 관련된 다른 정보가 있나요?
