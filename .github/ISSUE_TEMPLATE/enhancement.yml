name: 개선 제안
description: 기존 기능을 개선해주세요!
title: "[Enhancement] "
labels: ["type: enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 개선 제안 가이드
        기존 기능을 어떻게 개선하면 좋을지 알려주세요.

  - type: dropdown
    id: platform
    attributes:
      label: 대상 플랫폼
      description: 어느 플랫폼의 개선인가요?
      options:
        - 차량 앱
        - Server
        - 전체 플랫폼
        - 기타
      multiple: true
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 개선 분야
      description: 어떤 분야의 개선인가요?
      options:
        - UI/UX
        - 성능
        - 접근성
        - 보안
        - 코드 품질
        - 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 상황
      description: 현재 어떻게 동작하고 있나요?
      placeholder: "예: 동기화 실패 시 사용자에게 아무 표시가 없어 기록이 서버에 올라갔는지 알 수 없습니다."
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: 개선 제안
      description: 어떻게 개선하면 좋을까요?
      placeholder: "예: 운행기록 목록에 동기화 상태(대기/완료/실패) 배지를 표시"
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 기대 효과
      description: 이 개선으로 얻을 수 있는 이점은 무엇인가요?
      placeholder: |
        예:
        - 기록 누락 여부를 운전자가 즉시 확인
        - 관리자 문의 감소
        - 운행기록 신뢰도 향상

  - type: textarea
    id: screenshots
    attributes:
      label: 참고 자료
      description: 스크린샷, 참고 링크, 디자인 시안 등

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 다른 정보가 있나요?
