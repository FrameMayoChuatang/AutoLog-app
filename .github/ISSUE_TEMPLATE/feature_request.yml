name: 기능 제안
description: 새로운 기능을 제안해주세요!
title: "[Feature] "
labels: ["type: feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 기능 제안 가이드
        어떤 기능이 필요한지 자세히 설명해주세요.

  - type: dropdown
    id: platform
    attributes:
      label: 대상 플랫폼
      description: 어느 플랫폼에 적용될 기능인가요?
      options:
        - 차량 앱
        - Server
        - 전체 플랫폼
        - 기타
      multiple: true
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: 기능 설명
      description: 어떤 기능을 추가하고 싶으신가요?
      placeholder: "예: 운행 중 운전자를 바꿀 수 있는 운전자 변경 기능"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하고자 하는 문제
      description: 이 기능이 왜 필요한가요? 어떤 불편함을 해결하나요?
      placeholder: "예: 한 차량을 여러 명이 번갈아 운전할 때 기존 운행을 끝내고 새로 시작해야 해서 기록이 끊깁니다."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 어떻게 동작하면 좋을까요?
      placeholder: |
        예:
        1. 운행 중 화면에 "운전자 변경" 버튼 표시 (P 상태에서만)
        2. 버튼 클릭 시 운전자 선택 화면 표시
        3. 선택하면 기존 운행을 종료하고 새 운전자로 새 운행 시작
        4. 두 운행 기록 모두 서버로 동기화
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 다른 방법으로 해결할 수 있는 방법이 있나요?
      placeholder: "예: 운행 종료 후 관리자가 기록의 운전자를 수정"

  - type: textarea
    id: mockup
    attributes:
      label: 디자인 또는 참고 자료
      description: UI 스케치, 참고할 만한 다른 서비스 등

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 이 기능과 관련된 다른 정보가 있나요?
